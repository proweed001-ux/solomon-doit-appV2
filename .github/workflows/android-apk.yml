name: Build Order DOIT Android APK

on:
  push:
    branches:
      - codex/android-apk-wrapper
    paths:
      - "android-wrapper/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-wrapper/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Render supplied Order DOIT icon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-dejavu-core
          SOURCE="android-wrapper/app/src/main/icon/order_doit_icon.svg"
          DRAWABLE_DIR="android-wrapper/app/src/main/res/drawable-nodpi"
          MIPMAP_DIR="android-wrapper/app/src/main/res/mipmap-xxxhdpi"
          mkdir -p "$DRAWABLE_DIR" "$MIPMAP_DIR"
          rsvg-convert --width 512 --height 512 "$SOURCE" > "$DRAWABLE_DIR/order_doit_icon.png"
          cp "$DRAWABLE_DIR/order_doit_icon.png" "$MIPMAP_DIR/ic_launcher.png"
          cp "$DRAWABLE_DIR/order_doit_icon.png" "$MIPMAP_DIR/ic_launcher_round.png"
          test -s "$DRAWABLE_DIR/order_doit_icon.png"

      - name: Build installable debug APK
        working-directory: android-wrapper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/import android.app.PrintManager;/import android.print.PrintManager;/' \
            app/src/main/java/com/solomon/doitapp2/MainActivity.java
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK filename and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-wrapper/output
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk \
             android-wrapper/output/Order-DOIT-v1.0.0.apk
          sha256sum android-wrapper/output/Order-DOIT-v1.0.0.apk \
             > android-wrapper/output/Order-DOIT-v1.0.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Order-DOIT-v1.0.0-APK
          path: android-wrapper/output/*
          if-no-files-found: error
          retention-days: 30
