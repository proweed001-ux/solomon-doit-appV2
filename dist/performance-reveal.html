<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYA Top Performance · Reveal Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700;900&display=swap');

        :root {
            --gold: #eab308;
            --gold-light: #fef08a;
            --gold-deep: #a16207;
            --panel: rgba(15, 15, 15, 0.86);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: #050505;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ----- Background Effects: จากเวอร์ชันแรก ----- */
        .bg-rays {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vw;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(234, 179, 8, 0.05) 45deg, transparent 90deg);
            animation: spin 80s linear infinite;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .glass-panel {
            background: var(--panel);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(250, 204, 21, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .gold-text {
            background: linear-gradient(to right, #fef08a, #eab308, #a16207);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ----- Tabs: เพิ่มจากเวอร์ชัน 2 แต่คุมให้เข้ากับเวอร์ชันแรก ----- */
        .tab-btn {
            padding: 10px 24px;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            color: #777;
            background: rgba(17, 17, 17, 0.86);
            border: 1px solid rgba(234, 179, 8, 0.22);
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .tab-btn:hover { color: #facc15; border-color: rgba(234,179,8,0.55); }
        .tab-btn.active {
            color: #050505;
            background: linear-gradient(135deg, #fef08a, #eab308);
            border-color: #facc15;
            box-shadow: 0 0 28px rgba(234,179,8,0.24);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.35s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* ----- Suspense Reveal: หน่วงจังหวะก่อนเปิดผล ----- */
        .suspense-ring {
            width: 104px;
            height: 104px;
            border-radius: 999px;
            border: 2px solid rgba(234, 179, 8, 0.18);
            border-top-color: #facc15;
            border-right-color: #fef08a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px rgba(234, 179, 8, 0.2), inset 0 0 25px rgba(234, 179, 8, 0.08);
            animation: suspenseSpin 1.35s linear infinite;
        }
        .suspense-ring-inner {
            width: 76px;
            height: 76px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(250,204,21,0.2), rgba(0,0,0,0.95) 72%);
            animation: suspenseSpinReverse 1.35s linear infinite;
        }
        .suspense-number {
            font-size: 2.6rem;
            line-height: 1;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 24px rgba(250,204,21,0.7);
            animation: countdownPop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .suspense-dots {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }
        .suspense-dots span {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #3f3f46;
            transition: all 0.3s ease;
        }
        .suspense-dots span.active {
            width: 24px;
            background: #facc15;
            box-shadow: 0 0 16px rgba(250,204,21,0.65);
        }
        .category-spinner {
            width: 58px;
            height: 58px;
            border-radius: 999px;
            border: 2px solid rgba(234, 179, 8, 0.18);
            border-top-color: #facc15;
            box-shadow: 0 0 22px rgba(234,179,8,0.18);
            animation: suspenseSpin 0.9s linear infinite;
        }
        @keyframes suspenseSpin { to { transform: rotate(360deg); } }
        @keyframes suspenseSpinReverse { to { transform: rotate(-360deg); } }
        @keyframes countdownPop {
            0% { opacity: 0; transform: scale(0.35); }
            65% { opacity: 1; transform: scale(1.18); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ----- Podium Animation Styles: จากเวอร์ชันแรก ----- */
        .podium-wrap { min-height: 430px; }
        .podium-step {
            width: 120px;
            background: linear-gradient(to top, #111 0%, #2d2a19 100%);
            border-top: 4px solid #eab308;
            box-shadow: 0 -10px 40px rgba(234, 179, 8, 0.15);
            border-radius: 12px 12px 0 0;
            position: relative;
            transform-origin: bottom;
            opacity: 0;
            transform: scaleY(0);
        }
        @media (min-width: 430px) { .podium-step { width: 145px; } }
        @media (min-width: 768px) { .podium-step { width: 200px; } }

        .podium-step.rank-1 { height: 100%; border-color: #fbbf24; background: linear-gradient(to top, #111 0%, #42350a 100%); z-index: 3; }
        .podium-step.rank-2 { height: 75%; border-color: #94a3b8; background: linear-gradient(to top, #111 0%, #1e293b 100%); z-index: 2; }
        .podium-step.rank-3 { height: 60%; border-color: #b45309; background: linear-gradient(to top, #111 0%, #451a03 100%); z-index: 1; }
        @keyframes riseUp { to { opacity: 1; transform: scaleY(1); } }

        .avatar-container {
            position: absolute;
            top: -58px;
            left: 50%;
            margin-left: -40px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #eab308;
            background: #000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            opacity: 0;
        }
        @media (min-width: 768px) {
            .avatar-container { top: -75px; margin-left: -50px; width: 100px; height: 100px; border-width: 4px; }
            .rank-1 .avatar-container { width: 140px; height: 140px; top: -100px; margin-left: -70px; }
        }
        .rank-1 .avatar-container { border-color: #fbbf24; box-shadow: 0 0 30px rgba(251, 191, 36, 0.4); }
        .rank-2 .avatar-container { border-color: #cbd5e1; }
        .rank-3 .avatar-container { border-color: #d97706; }

        @keyframes dropIn { from { transform: translateY(-50px) scale(0.5); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        @keyframes fadeInReveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ----- One award per screen ----- */
        .top5-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 12px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.06);
            font-size: clamp(0.9rem, 1.2vw, 1.1rem);
        }
        .top5-list li:last-child { border-bottom: none; }
        .rank-badge {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-weight: 900;
            font-size: 0.82rem;
            color: black;
            flex: 0 0 auto;
        }
        .rank-1-badge { background: linear-gradient(135deg, #fef08a, #eab308); box-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
        .rank-2-badge { background: linear-gradient(135deg, #e2e8f0, #94a3b8); }
        .rank-3-badge { background: linear-gradient(135deg, #fed7aa, #b45309); }
        .rank-normal { background: #333; color: #aaa; }

        .category-card {
            width: 100%;
            max-width: 1280px;
            min-height: clamp(560px, calc(100vh - 220px), 780px);
            height: clamp(560px, calc(100vh - 220px), 780px);
            margin: 0 auto;
            border-radius: 1rem;
            overflow: hidden;
            position: relative;
        }

        .award-shell {
            width: 100%;
            max-width: 1360px;
            margin: 0 auto;
        }
        .award-stage {
            width: 100%;
            min-height: clamp(560px, calc(100vh - 220px), 780px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .award-stage > [id^="categories-area-"] {
            width: 100%;
            min-width: 0;
            flex: 0 0 100%;
        }
        .award-slide {
            display: none;
            width: 100%;
        }
        .award-slide.active {
            display: flex;
            animation: awardEnter 0.42s ease both;
        }
        .award-slide.category-card.active {
            display: block;
        }
        .overall-award {
            min-height: clamp(560px, calc(100vh - 220px), 780px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .overall-award .podium-wrap {
            margin-bottom: 0;
        }
        .award-controls {
            display: grid;
            grid-template-columns: minmax(110px, 1fr) minmax(150px, 1.4fr) minmax(110px, 1fr);
            align-items: center;
            gap: 12px;
            margin-top: 18px;
        }
        .award-nav-btn {
            min-height: 48px;
            padding: 10px 16px;
            border: 1px solid rgba(234, 179, 8, 0.35);
            border-radius: 14px;
            background: rgba(17, 17, 17, 0.94);
            color: #facc15;
            font-weight: 900;
            transition: 0.2s ease;
        }
        .award-nav-btn:hover:not(:disabled) {
            background: #facc15;
            color: #050505;
            transform: translateY(-1px);
        }
        .award-nav-btn:disabled {
            opacity: 0.28;
            cursor: not-allowed;
        }
        .award-position {
            text-align: center;
            min-width: 0;
        }
        .award-position strong {
            display: block;
            color: #facc15;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
        }
        .award-position span {
            display: block;
            margin-top: 3px;
            color: #9ca3af;
            font-size: 0.78rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @keyframes awardEnter {
            from { opacity: 0; transform: translateX(24px) scale(0.985); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
        @media (max-width: 640px) {
            .award-controls {
                grid-template-columns: 1fr 1fr;
            }
            .award-position {
                grid-column: 1 / -1;
                grid-row: 1;
            }
            .award-nav-btn {
                grid-row: 2;
            }
        }

        .race-card {
            width: 100%;
            max-width: 1280px;
            min-height: clamp(560px, calc(100vh - 220px), 780px);
            height: clamp(560px, calc(100vh - 220px), 780px);
            margin: 0 auto;
            padding: 24px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            grid-template-rows: auto minmax(0, 1fr) auto;
            row-gap: 16px;
        }
        .overall-award > .race-card {
            display: grid;
        }
        .award-slide.category-card.race-card {
            display: none;
        }
        .award-slide.category-card.race-card.active {
            display: grid;
        }
        .race-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            min-height: 62px;
        }
        .race-header h3 {
            color: #facc15;
            font-size: clamp(1rem, 2vw, 1.45rem);
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .race-header p {
            margin-top: 4px;
            color: #9ca3af;
            font-size: 0.8rem;
        }
        .race-date {
            flex: 0 0 auto;
            padding: 7px 12px;
            border: 1px solid rgba(250, 204, 21, 0.28);
            border-radius: 999px;
            background: rgba(250, 204, 21, 0.07);
            color: #fde047;
            font-size: 0.78rem;
            font-weight: 800;
        }
        .race-track {
            height: auto;
            min-height: 0;
            margin-top: 0;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid rgba(250, 204, 21, 0.18);
        }
        .race-row {
            position: absolute;
            bottom: 0;
            left: 0;
            width: calc(100% / var(--race-lanes, 5));
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transform: translateX(0);
            transition: opacity 0.28s ease;
            will-change: transform;
        }
        .race-row.is-top-five {
            opacity: 1;
        }
        .race-bar-lane {
            width: min(88%, 120px);
            height: calc(100% - 58px);
            display: flex;
            align-items: flex-end;
            overflow: visible;
            position: relative;
        }
        .race-bar {
            width: 100%;
            height: 0;
            min-height: 0;
            border-top: 3px solid rgba(250, 204, 21, 0.62);
            border-radius: 18px 18px 3px 3px;
            background: linear-gradient(180deg, rgba(113,63,18,0.92), rgba(30,24,12,0.98) 58%, rgba(10,10,10,0.99));
            box-shadow: 0 -10px 28px rgba(234,179,8,0.16), inset 10px 0 18px rgba(255,255,255,0.035), inset -12px 0 20px rgba(0,0,0,0.46);
            transition: height 0.08s linear;
            position: relative;
            overflow: visible;
        }
        .race-bar::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(255,255,255,0.045), transparent 38%, rgba(0,0,0,0.2));
            pointer-events: none;
        }
        .race-avatar {
            position: absolute;
            top: -43px;
            left: 50%;
            width: 68px;
            height: 68px;
            transform: translateX(-50%);
            border: 3px solid #d4a51f;
            border-radius: 999px;
            background: radial-gradient(circle at 50% 35%, #2b2311, #050505 72%);
            box-shadow: 0 0 0 4px rgba(5,5,5,0.9), 0 0 25px rgba(234,179,8,0.28);
            overflow: hidden;
            z-index: 3;
        }
        .race-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .race-bar-copy {
            position: absolute;
            top: 44px;
            left: 5px;
            right: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            text-align: center;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 2;
        }
        .race-row.race-started .race-bar-copy {
            opacity: 1;
            transform: translateY(0);
        }
        .race-rank {
            min-height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 3px 7px;
            border-radius: 5px;
            background: rgba(0,0,0,0.72);
            color: #facc15;
            font-size: 0.64rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.38s ease, transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .race-row.race-finished .race-rank {
            opacity: 1;
            transform: scale(1);
        }
        .race-name {
            width: 100%;
            overflow: visible;
            color: #f4f4f5;
            font-size: clamp(0.68rem, 1.05vw, 0.9rem);
            font-weight: 800;
            line-height: 1.15;
            text-overflow: clip;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        .race-code {
            width: 100%;
            color: #ffffff;
            font-size: clamp(0.56rem, 0.9vw, 0.75rem);
            font-weight: 800;
            line-height: 1;
            opacity: 0.82;
            letter-spacing: 0.04em;
        }
        .race-actual {
            color: #f4f4f5;
            font-size: clamp(0.72rem, 1.2vw, 0.98rem);
            font-weight: 900;
            line-height: 1;
        }
        .race-percent {
            color: #facc15;
            font-size: clamp(0.78rem, 1.45vw, 1.08rem);
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 0 14px rgba(250,204,21,0.2);
        }

        .race-row[data-final-rank="1"] .race-bar {
            border-top-color: #fde047;
            background: linear-gradient(180deg, rgba(128,97,16,0.98), rgba(61,48,13,0.99) 50%, rgba(13,12,7,1));
            box-shadow: 0 -12px 36px rgba(250,204,21,0.34), inset 12px 0 20px rgba(255,255,255,0.055), inset -12px 0 22px rgba(0,0,0,0.42);
        }
        .race-row[data-final-rank="2"] .race-bar {
            border-top-color: #cbd5e1;
            background: linear-gradient(180deg, rgba(51,65,85,0.98), rgba(25,34,48,0.99) 52%, rgba(8,11,16,1));
            box-shadow: 0 -11px 32px rgba(203,213,225,0.2), inset 12px 0 20px rgba(255,255,255,0.05), inset -12px 0 22px rgba(0,0,0,0.44);
        }
        .race-row[data-final-rank="3"] .race-bar {
            border-top-color: #f59e0b;
            background: linear-gradient(180deg, rgba(119,49,8,0.98), rgba(62,28,9,0.99) 52%, rgba(16,9,5,1));
            box-shadow: 0 -11px 32px rgba(245,158,11,0.24), inset 12px 0 20px rgba(255,255,255,0.045), inset -12px 0 22px rgba(0,0,0,0.44);
        }
        .race-row[data-final-rank="4"] .race-bar {
            border-top-color: #a8a29e;
            background: linear-gradient(180deg, rgba(55,53,49,0.98), rgba(31,29,27,0.99) 52%, rgba(9,9,9,1));
        }
        .race-row[data-final-rank="5"] .race-bar {
            border-top-color: #b45309;
            background: linear-gradient(180deg, rgba(76,38,14,0.98), rgba(39,22,12,0.99) 52%, rgba(11,8,6,1));
        }
        .race-row[data-final-rank="1"] .race-avatar { border-color: #fde047; box-shadow: 0 0 0 4px #090909, 0 0 28px rgba(250,204,21,0.48); }
        .race-row[data-final-rank="2"] .race-avatar { border-color: #cbd5e1; box-shadow: 0 0 0 4px #090909, 0 0 24px rgba(203,213,225,0.28); }
        .race-row[data-final-rank="3"] .race-avatar { border-color: #f59e0b; box-shadow: 0 0 0 4px #090909, 0 0 24px rgba(245,158,11,0.3); }
        .race-row[data-final-rank="4"] .race-avatar { border-color: #a8a29e; }
        .race-row[data-final-rank="5"] .race-avatar { border-color: #b45309; }
        .race-row[data-final-rank="1"] .race-actual,
        .race-row[data-final-rank="1"] .race-percent { color: #fde047; }
        .race-row[data-final-rank="2"] .race-actual,
        .race-row[data-final-rank="2"] .race-percent { color: #e2e8f0; }
        .race-row[data-final-rank="3"] .race-actual,
        .race-row[data-final-rank="3"] .race-percent { color: #fb923c; }
        .race-row.race-finished[data-final-rank="1"] .race-rank::before { content: "♛ "; }
        .race-row .race-rank,
        .race-row .race-name,
        .race-row .race-code,
        .race-row .race-actual,
        .race-row .race-percent {
            color: #ffffff;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.72);
        }

        .race-card.winner-ready {
            cursor: pointer;
        }
        .winner-reveal {
            --winner-caption-height: clamp(68px, 10vmin, 104px);
            position: absolute;
            inset: 0;
            z-index: 70;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
            overflow: hidden;
            background: #050505;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.985);
            transition: opacity 0.45s ease, transform 0.55s ease, visibility 0.45s;
        }
        .winner-reveal.is-visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }
        .winner-photo-bg,
        .winner-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-position: center;
        }
        .winner-photo-bg {
            object-fit: cover;
            filter: blur(30px) brightness(0.42) saturate(1.1);
            transform: scale(1.14);
            opacity: 0.92;
        }
        .winner-photo {
            z-index: 2;
            inset: 0 0 auto 0;
            height: calc(100% - var(--winner-caption-height));
            object-fit: contain;
            padding: clamp(6px, 1.2vmin, 18px);
            padding-bottom: 0;
            filter: brightness(0.94) saturate(1.04) drop-shadow(0 12px 34px rgba(0,0,0,0.72));
            transform: scale(0.97);
            opacity: 0;
        }
        .winner-reveal.is-visible .winner-photo-bg {
            animation: winnerBackdropIn 1.2s ease-out forwards;
        }
        .winner-reveal.is-visible .winner-photo {
            animation: winnerPhotoIn 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .winner-shade {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(0,0,0,0.04) 0%, rgba(0,0,0,0.08) 68%, rgba(0,0,0,0.76) 100%),
                radial-gradient(circle at 50% 28%, rgba(250,204,21,0.12), transparent 48%);
            pointer-events: none;
        }
        .winner-rays {
            position: absolute;
            top: 30%;
            left: 50%;
            width: min(115vw, 1120px);
            aspect-ratio: 1;
            border-radius: 999px;
            background: repeating-conic-gradient(
                from 0deg,

        function numberValue(value) {
            const number = Number(String(value ?? 0).replace(/,/g, '').replace(/%/g, '').trim());
            return Number.isFinite(number) ? number : 0;
        }

        function metricActual(row, key) {
            return numberValue(row?.[key]?.actual);
        }

        function metricPercent(row, key) {
            if (key === "overall") {
                const keys = ["sales", "giv", "moq", "dc1", "dc2", "dc3"];
                const values = keys.map(metricKey => metricPercent(row, metricKey)).filter(value => value > 0);
                return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
            }

            if (key === "cd13" && !row?.cd13) {
                const metrics = ["dc1", "dc2", "dc3"].map(metricKey => row?.[metricKey] || {});
                const target = metrics.reduce((sum, metric) => sum + numberValue(metric.target), 0);
                const actual = metrics.reduce((sum, metric) => sum + numberValue(metric.actual), 0);
                return target > 0 ? (actual / target) * 100 : 0;
            }

            const metric = row?.[key] || {};
            const directIndex = numberValue(metric.index);
            if (directIndex > 0) return directIndex;
            const target = numberValue(metric.target);
            return target > 0 ? (numberValue(metric.actual) / target) * 100 : 0;
        }

            const name = String(
                mode === "ps"
                    ? (row?.name || row?.psName || "")
                    : (row?.name || row?.adsName || "")

            if (!name || name === code) return code || name || "-";
            return name;

        function updatePerformancePeriod(meta) {
            const period = document.getElementById("performance-period");

            const rawDate = String(meta?.reportDate || meta?.reportKey || "").trim();
            const dateMatch = rawDate.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
            if (!dateMatch) {

                return;
            }

            const date = new Date(Date.UTC(Number(dateMatch[1]), Number(dateMatch[2]) - 1, Number(dateMatch[3])));
            const monthYear = new Intl.DateTimeFormat("en-US", {
                month: "long",
                year: "numeric",

            }).format(date);
            period.textContent = `CHAMPIONS OF ${monthYear.toUpperCase()}`;

        function performanceObjectUrl(path) {
            return /^https?:\/\//i.test(path)
                ? path
                : `${PERFORMANCE_OBJECT_BASE}${String(path || "").replace(/^\/+/, "")}`;
        }

        async function fetchPerformanceJson(path, timeoutMs = 12000, options = {}) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), timeoutMs);
            const url = performanceObjectUrl(path);
            const rememberHistory = options.rememberHistory === true && "caches" in window;

            if (rememberHistory) {
                try {
                    const cache = await caches.open(PERFORMANCE_HISTORY_CACHE);
                    const cached = await cache.match(url);
                    if (cached) {
                        const data = await cached.json();
                        if (options.stats) options.stats.remembered += 1;
                        clearTimeout(timeout);
                        return data;
                    }
                } catch (error) {
                    console.warn("[AYA Performance Cache Read]", error);
                }
            }

            try {
                const response = await fetch(url, {
                    headers: {
                        apikey: PERFORMANCE_PUBLIC_KEY,
                        authorization: `Bearer ${PERFORMANCE_PUBLIC_KEY}`
                    },
                    cache: "no-store",
                    signal: controller.signal
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (rememberHistory && options.stats) options.stats.downloaded += 1;

                if (rememberHistory) {
                    try {
                        const cache = await caches.open(PERFORMANCE_HISTORY_CACHE);
                        await cache.put(url, new Response(JSON.stringify(data), {
                            headers: { "content-type": "application/json; charset=utf-8" }
                        }));
                    } catch (error) {
                        console.warn("[AYA Performance Cache Write]", error);
                    }
                }

                return data;
            } finally {
                clearTimeout(timeout);
            }
        }

        function snapshotLabel(snapshot) {

                snapshot?.meta?.reportKey ||
                snapshot?.reportDate ||

                "-"
            );
        }

        async function loadPerformanceTimeline(latest) {
            try {
                const index = await fetchPerformanceJson(PERFORMANCE_HISTORY_INDEX, 8000);
                const currentLabel = snapshotLabel(latest);
                const unique = new Map();
                const indexed = (Array.isArray(index) ? index : []).filter(item => item?.path);
                const compactHistory = indexed.filter(item => String(item.path).startsWith("performance/compare/"));
                const candidates = compactHistory.length ? compactHistory : indexed;

                candidates.forEach(item => {
                    const label = String(item.reportDate || item.reportKey || item.path);
                    if (label === currentLabel || unique.has(label)) return;
                    unique.set(label, item);
                });

                const selected = [...unique.values()]
                    .filter(item => {
                        const label = String(item.reportDate || item.reportKey || "");
                        return !currentLabel || !label || label < currentLabel;
                    })
                    .sort((a, b) => String(a.reportDate || a.reportKey || "").localeCompare(String(b.reportDate || b.reportKey || "")));

                const stats = { remembered: 0, downloaded: 0 };
                const loaded = await Promise.allSettled(
                    selected.map(item => fetchPerformanceJson(item.path, 12000, {
                        rememberHistory: true,
                        stats
                    }))
                );
                const history = loaded
                    .filter(result => result.status === "fulfilled")
                    .map(result => result.value)
                    .filter(snapshot => Array.isArray(snapshot?.ps) && Array.isArray(snapshot?.ads));

                performanceCacheStats = stats;
                return [...history, latest];
            } catch (error) {
                console.warn("[AYA Performance History]", error);
                performanceCacheStats = { remembered: 0, downloaded: 0 };
                return [latest];
            }
        }

        async function loadPerformanceData() {
            const status = document.getElementById("performance-data-status");

            try {
                const latest = await fetchPerformanceJson(PERFORMANCE_DATA_URL, 12000);
                if (!Array.isArray(latest?.ps) || !Array.isArray(latest?.ads)) {

                const reportLabel = latest?.meta?.reportDate || latest?.meta?.reportKey || "ล่าสุด";
                const historyCount = Math.max(performanceTimeline.length - 1, 0);
                status.textContent = historyCount
                    ? `ข้อมูลล่าสุด • ${reportLabel} • ${performanceTimeline.length} ช่วงจริง • จำไว้แล้ว ${performanceCacheStats.remembered} • โหลดใหม่ ${performanceCacheStats.downloaded}`
                    : `ข้อมูลล่าสุด • ${reportLabel} • ยังไม่มีช่วงย้อนหลังสำหรับการแซง`;

                performanceLoadFailed = true;

                status.textContent = `โหลดข้อมูลล่าสุดไม่สำเร็จ (${error.name === "AbortError" ? "หมดเวลา" : error.message})`;

        function activeFullscreenElement() {
            return document.fullscreenElement || document.webkitFullscreenElement || null;
        }

        function syncFullscreenMode() {
            const active = Boolean(activeFullscreenElement()) || document.body.classList.contains("pseudo-fullscreen");
            document.body.classList.toggle("presentation-mode", active);
            const button = document.getElementById("fullscreen-toggle");
            if (!button) return;
            button.textContent = active ? "✕ ออกจากเต็มจอ" : "⛶ เต็มจอ";
            button.setAttribute("aria-pressed", String(active));
        }

        async function toggleFullscreenMode() {
            const pseudo = document.body.classList.contains("pseudo-fullscreen");
            const fullscreen = activeFullscreenElement();
            if (pseudo) {
                if (pseudoFullscreenHistoryPushed) {
                    history.back();
                } else {
                    document.body.classList.remove("pseudo-fullscreen");
                    syncFullscreenMode();
                }
                return;
            }
            if (fullscreen) {
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (exit) await exit.call(document);
                syncFullscreenMode();
                return;
            }

            const root = document.documentElement;
            const request = root.requestFullscreen || root.webkitRequestFullscreen;
            if (request) {
                try {
                    await request.call(root);
                    syncFullscreenMode();
                    return;
                } catch (error) {
                    console.warn("[AYA Fullscreen]", error);
                }
            }

            history.pushState({ ayaPerformanceFullscreen: true }, "", location.href);
            pseudoFullscreenHistoryPushed = true;
            document.body.classList.add("pseudo-fullscreen");
            syncFullscreenMode();
        }

        document.addEventListener("fullscreenchange", syncFullscreenMode);
        document.addEventListener("webkitfullscreenchange", syncFullscreenMode);
        window.addEventListener("popstate", () => {
            if (!document.body.classList.contains("pseudo-fullscreen")) return;
            pseudoFullscreenHistoryPushed = false;
            document.body.classList.remove("pseudo-fullscreen");
            syncFullscreenMode();
        });
        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && document.body.classList.contains("pseudo-fullscreen")) {
                if (pseudoFullscreenHistoryPushed) {
                    history.back();
                } else {
                    document.body.classList.remove("pseudo-fullscreen");
                    syncFullscreenMode();
                }
                return;
            }
            if (!document.body.classList.contains("presentation-mode")) return;
            if (event.key === "ArrowLeft") {
                event.preventDefault();
                movePresentationAward(-1);
            }
            if (event.key === "ArrowRight") {
                event.preventDefault();
                movePresentationAward(1);
            }
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`btn-${tab}`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');

        function getAwardSlides(mode) {
            return Array.from(document.querySelectorAll(`#award-stage-${mode} [data-award-slide]`));
        }

        function showAward(mode, index, shouldScroll = false) {
            const slides = getAwardSlides(mode);
            if (!slides.length) return;

            const safeIndex = Math.max(0, Math.min(index, slides.length - 1));
            awardIndex[mode] = safeIndex;
            slides.forEach((slide, slideIndex) => {
                slide.classList.toggle('active', slideIndex === safeIndex);
            });

            const activeSlide = slides[safeIndex];
            document.getElementById(`award-counter-${mode}`).textContent = `รางวัล ${safeIndex + 1} / ${slides.length}`;
            document.getElementById(`award-title-${mode}`).textContent = activeSlide.dataset.awardTitle || 'Performance Award';

            const previous = document.getElementById(`award-prev-${mode}`);
            const next = document.getElementById(`award-next-${mode}`);
            previous.disabled = safeIndex === 0;
            next.disabled = safeIndex === slides.length - 1;
            next.textContent = safeIndex === slides.length - 1 ? 'ครบทุกรางวัล' : 'รางวัลถัดไป →';

            if (shouldScroll) {
                document.getElementById(`tab-${mode}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function moveAward(mode, direction) {
            showAward(mode, awardIndex[mode] + direction, true);
        }

        function movePresentationAward(direction) {
            const activeTab = document.querySelector(".tab-content.active");
            const mode = activeTab?.dataset.mode;
            if (!mode) return;
            const slides = getAwardSlides(mode);
            if (!slides.length) return;
            const nextIndex = (awardIndex[mode] + direction + slides.length) % slides.length;
            showAward(mode, nextIndex, false);
        }

            if (key === "overall") return metricPercent(row, key);
            if (key === "cd13" && !row?.cd13) {
                return ["dc1", "dc2", "dc3"].reduce((sum, metricKey) => sum + metricActual(row, metricKey), 0);

            }
            const unit = performanceCategories.find(category => category.key === key)?.unit || "";
            const formatted = number.toLocaleString("th-TH", { maximumFractionDigits: 0 });
            if (unit === "บาท") return `${formatted} ฿`;
            return unit ? `${formatted} ${unit}` : formatted;
        }

        function raceRankingValue(row, key) {
            return key === "sales"
                ? raceActualValue(row, key)
                : metricPercent(row, key);
        }

        function raceFrame(snapshot, mode, key) {
            const rows = Array.isArray(snapshot?.[mode]) ? snapshot[mode] : [];
            return {
                label: snapshotLabel(snapshot),
                rows: rows.map(row => ({
                    id: rowIdentity(row, mode),
                    code: profileKey(row, mode) || rowIdentity(row, mode),
                    name: displayName(row, mode),
                    photoKey: profileKey(row, mode),
                    actual: raceActualValue(row, key),
                    percent: metricPercent(row, key),
                    value: raceRankingValue(row, key)
                })).filter(row => row.id)
            };
        }

        function interpolateRaceRows(fromRows, toRows, progress) {
            const fromMap = new Map(fromRows.map(row => [row.id, row]));
            const toMap = new Map(toRows.map(row => [row.id, row]));
            const ids = new Set([...fromMap.keys(), ...toMap.keys()]);
            return [...ids].map(id => {
                const from = fromMap.get(id);
                const to = toMap.get(id);
                const start = from?.value || 0;
                const end = to?.value || 0;
                const startActual = from?.actual || 0;
                const endActual = to?.actual || 0;
                const startPercent = from?.percent || 0;
                const endPercent = to?.percent || 0;
                return {
                    id,
                    code: to?.code || from?.code || id,
                    name: to?.name || from?.name || id,
                    photoKey: to?.photoKey || from?.photoKey || id,
                    actual: startActual + (endActual - startActual) * progress,
                    percent: startPercent + (endPercent - startPercent) * progress,
                    value: start + (end - start) * progress
                };
            });
        }

        function formatRacePercent(value) {
            return `${numberValue(value).toLocaleString("th-TH", {
                minimumFractionDigits: 1,
                maximumFractionDigits: 1
            })}%`;
        }

        function latestRaceFinalists(frames) {
            const latestRows = frames.at(-1)?.rows || [];
            return [...latestRows]
                .sort((a, b) => b.value - a.value)
                .slice(0, 5)
                .sort((a, b) => a.name.localeCompare(b.name, "th"));
        }

        function renderRaceRows(container, rows, showRanks = false) {
            if (!container._raceRows) container._raceRows = new Map();
            const laneIds = container._raceLaneIds || [];
            const profiles = container._raceProfiles || new Map();
            const rowMap = new Map(rows.map(row => [row.id, row]));
            const ranked = [...rows].sort((a, b) => b.value - a.value);
            const rankById = new Map(ranked.map((row, index) => [row.id, index + 1]));
            const maximum = Math.max(container._raceMaximum || 1, 1);

            laneIds.forEach((id, laneIndex) => {
                const person = rowMap.get(id) || { ...profiles.get(id), value: 0, actual: 0, percent: 0 };
                let row = container._raceRows.get(id);
                if (!row) {
                    row = document.createElement("div");
                    row.className = "race-row is-top-five";
                    row.innerHTML = `
                        <div class="race-bar-lane">
                            <div class="race-bar">
                                <div class="race-avatar"><img alt=""></div>
                                <div class="race-bar-copy">
                                    <span class="race-rank"></span>
                                    <span class="race-name"></span>
                                    <span class="race-code"></span>
                                    <strong class="race-actual"></strong>
                                    <strong class="race-percent"></strong>
                                </div>
                            </div>
                        </div>
                    `;
                    row._raceParts = {
                        rank: row.querySelector(".race-rank"),
                        name: row.querySelector(".race-name"),
                        code: row.querySelector(".race-code"),
                        image: row.querySelector(".race-avatar img"),
                        actual: row.querySelector(".race-actual"),
                        bar: row.querySelector(".race-bar"),
                        percent: row.querySelector(".race-percent")
                    };
                    container.appendChild(row);
                    container._raceRows.set(id, row);
                }

                const rank = rankById.get(id) || laneIds.length;
                const finalRank = container._raceFinalRankById?.get(id) || rank;
                const parts = row._raceParts;
                row.classList.toggle("race-finished", showRanks);
                row.classList.toggle("race-started", person.value / maximum > 0.08);
                row.dataset.rank = String(rank);
                row.dataset.finalRank = String(finalRank);
                row.style.transform = `translateX(${laneIndex * 100}%)`;
                parts.rank.textContent = String(rank);
                parts.name.textContent = person.name;
                parts.code.textContent = person.code || person.id || "";
                const image = parts.image;
                const profileSignature = person.photoKey || person.name;
                if (row._raceProfileSignature !== profileSignature) {
                    row._raceProfileSignature = profileSignature;
                    image.src = personImageUrl(profileSignature);
                    image.onerror = () => safeImageOnError(image, person.name);
                }
                parts.bar.style.height = person.value > 0
                    ? `${Math.max((person.value / maximum) * 100, 1.5)}%`
                    : "0%";
                parts.actual.textContent = formatRaceActual(person.actual, container._raceMetricKey);
                const hidePercent = container._raceMetricKey === "sales";
                parts.percent.hidden = hidePercent;
                parts.percent.textContent = hidePercent ? "" : formatRacePercent(person.percent);
            });
        }

        function revealRaceRanks(container) {
            container.querySelectorAll(".race-row").forEach(row => {
                row.classList.add("race-finished");
            });
        }

        function closeWinnerReveal(card) {
            const overlay = card?.querySelector(".winner-reveal");
            if (!overlay) return;
            overlay.classList.remove("is-visible");
            overlay.setAttribute("aria-hidden", "true");
            card.classList.remove("winner-open");
            document.body.classList.remove("winner-overlay-open");
        }

        function showWinnerReveal(card, container) {
            const winner = container?._raceWinner;
            if (!card || !winner) return;

            let overlay = card.querySelector(".winner-reveal");
            if (!overlay) {
                overlay = document.createElement("section");
                overlay.className = "winner-reveal";
                overlay.setAttribute("aria-hidden", "true");
                overlay.innerHTML = `
                    <img class="winner-photo-bg" alt="" aria-hidden="true">
                    <div class="winner-rays" aria-hidden="true"></div>
                    <div class="winner-flash" aria-hidden="true"></div>
                    <div class="winner-fireworks" aria-hidden="true"></div>
                    <img class="winner-photo" alt="">
                    <div class="winner-shade" aria-hidden="true"></div>
                    <div class="winner-confetti" aria-hidden="true"></div>
                    <button class="winner-back" type="button" aria-label="กลับไปดูอันดับ">←</button>
                    <div class="winner-content">
                        <h2 class="winner-title"></h2>
                        <span class="winner-code"></span>
                        <strong class="winner-value"></strong>
                        <strong class="winner-percent"></strong>
                    </div>
                `;
                overlay.querySelector(".winner-back").addEventListener("click", event => {
                    event.stopPropagation();
                    closeWinnerReveal(card);
                });
                const confetti = overlay.querySelector(".winner-confetti");
                const colors = ["#facc15", "#fef08a", "#ffffff", "#d97706", "#fb7185"];
                for (let index = 0; index < 48; index += 1) {
                    const piece = document.createElement("i");
                    piece.style.setProperty("--left", `${(index * 37) % 100}%`);
                    piece.style.setProperty("--delay", `${(index % 12) * 0.1}s`);
                    piece.style.setProperty("--duration", `${2.4 + (index % 5) * 0.28}s`);
                    piece.style.setProperty("--drift", `${((index % 9) - 4) * 24}px`);
                    piece.style.setProperty("--piece-width", `${5 + (index % 4)}px`);
                    piece.style.setProperty("--piece-height", `${10 + (index % 5) * 3}px`);
                    piece.style.setProperty("--color", colors[index % colors.length]);
                    confetti.appendChild(piece);
                }

                const fireworks = overlay.querySelector(".winner-fireworks");
                const bursts = [
                    ["18%", "24%", "0.05s"],
                    ["82%", "20%", "0.38s"],
                    ["32%", "42%", "0.82s"],
                    ["70%", "40%", "1.18s"],
                    ["12%", "58%", "1.55s"],
                    ["88%", "56%", "1.92s"],
                    ["50%", "18%", "2.2s"]
                ];
                bursts.forEach((burst, index) => {
                    const firework = document.createElement("i");
                    firework.style.setProperty("--x", burst[0]);
                    firework.style.setProperty("--y", burst[1]);
                    firework.style.setProperty("--delay", burst[2]);
                    firework.style.setProperty("--color", colors[index % colors.length]);
                    fireworks.appendChild(firework);
                });
                card.appendChild(overlay);
            }

            const imageUrl = personImageUrl(winner.photoKey || winner.name);
            const backgroundImage = overlay.querySelector(".winner-photo-bg");
            const image = overlay.querySelector(".winner-photo");
            backgroundImage.src = imageUrl;
            backgroundImage.onerror = () => safeImageOnError(backgroundImage, winner.name);
            image.src = imageUrl;
            image.alt = `ผู้ชนะอันดับ 1 ${winner.name}`;
            image.onerror = () => safeImageOnError(image, winner.name);
            overlay.querySelector(".winner-title").textContent = winner.name;
            const winnerCode = overlay.querySelector(".winner-code");
            const code = winner.code || winner.id || winner.photoKey || "";
            winnerCode.hidden = !code;
            winnerCode.textContent = code;
            overlay.querySelector(".winner-value").textContent =
                formatRaceActual(winner.actual, container._raceMetricKey);
            const percent = overlay.querySelector(".winner-percent");
            const hidePercent = container._raceMetricKey === "sales";
            percent.hidden = hidePercent;
            percent.textContent = hidePercent ? "" : formatRacePercent(winner.percent);

            card.classList.add("winner-open");
            document.body.classList.add("winner-overlay-open");
            overlay.setAttribute("aria-hidden", "false");
            overlay.classList.remove("is-visible");
            requestAnimationFrame(() => overlay.classList.add("is-visible"));
        }

        function handleRaceCardClick(event) {
            if (event.target.closest("button, a")) return;
            const card = event.currentTarget;
            const container = document.getElementById(card.dataset.raceContainerId || "");
            if (!container?._raceFinished || card.classList.contains("winner-open")) return;
            showWinnerReveal(card, container);
        }

        function animateRaceTimeline(container, frames, duration, dateLabel, runKey, token) {
            return new Promise(resolve => {
                const startFrame = {
                    label: "เริ่มต้น",
                    rows: [...(container._raceProfiles?.values() || [])].map(row => ({ ...row, value: 0, actual: 0, percent: 0 }))
                };
                let startedAt = 0;
                const step = timestamp => {
                    if (raceRuns.get(runKey) !== token) {
                        resolve(false);
                        return;
                    }
                    if (!startedAt) startedAt = timestamp;
                    const progress = Math.min((timestamp - startedAt) / duration, 1);
                    const scaled = progress * frames.length;
                    const frameIndex = Math.min(Math.floor(scaled), frames.length - 1);
                    const localProgress = progress >= 1 ? 1 : scaled - frameIndex;
                    const fromFrame = frameIndex === 0 ? startFrame : frames[frameIndex - 1];
                    const toFrame = frames[frameIndex];
                    if (dateLabel) dateLabel.textContent = toFrame.label;
                    renderRaceRows(container, interpolateRaceRows(fromFrame.rows, toFrame.rows, localProgress), false);
                    if (progress < 1) {
                        requestAnimationFrame(step);
                    } else {
                        resolve(true);
                    }
                };
                requestAnimationFrame(step);
            });
        }

        async function startRace(mode, key, containerId) {
            if (!performanceReady || !performanceTimeline.length) return;
            const container = document.getElementById(containerId);
            if (!container) return;

            const card = container.closest(".race-card");
            closeWinnerReveal(card);
            card?.classList.remove("winner-ready");
            container._raceFinished = false;
            container._raceWinner = null;

            const runKey = `${mode}:${key}:${containerId}`;
            const token = (raceRuns.get(runKey) || 0) + 1;
            raceRuns.set(runKey, token);
            container.innerHTML = "";
            container._raceRows = new Map();

            const rawFrames = performanceTimeline.map(snapshot => raceFrame(snapshot, mode, key));
            const finalists = latestRaceFinalists(rawFrames);
            if (!finalists.length) return;
            const finalistIds = new Set(finalists.map(row => row.id));
            const frames = rawFrames.map(frame => {
                const frameRows = new Map(frame.rows.filter(row => finalistIds.has(row.id)).map(row => [row.id, row]));
                return {
                    ...frame,
                    rows: finalists.map(profile => frameRows.get(profile.id) || { ...profile, value: 0, actual: 0, percent: 0 })
                };
            });

            container._raceLaneIds = finalists.map(row => row.id);
            container._raceProfiles = new Map(finalists.map(row => [row.id, row]));
            container._raceFinalRankById = new Map(
                [...finalists]
                    .sort((a, b) => b.value - a.value)
                    .map((row, index) => [row.id, index + 1])
            );
            container._raceMetricKey = key;
            container._raceMaximum = Math.max(...frames.flatMap(frame => frame.rows.map(row => row.value)), 1) * 1.05;
            container.style.setProperty("--race-lanes", String(finalists.length));

            const dateLabel = document.getElementById(`race-date-${mode}-${key}`);
            renderRaceRows(container, finalists.map(row => ({ ...row, value: 0, actual: 0, percent: 0 })), false);
            const completed = await animateRaceTimeline(container, frames, RACE_DURATION_MS, dateLabel, runKey, token);
            if (!completed || raceRuns.get(runKey) !== token) return;

            await new Promise(resolve => setTimeout(resolve, 650));
            if (raceRuns.get(runKey) !== token) return;
            revealRaceRanks(container);
            const winner = [...frames.at(-1).rows].sort((a, b) => b.value - a.value)[0] || null;
            container._raceWinner = winner;
            container._raceFinished = Boolean(winner);
            card?.classList.toggle("winner-ready", Boolean(winner));
            if (dateLabel) {
                dateLabel.textContent = winner
                    ? "เปิดอันดับแล้ว • แตะกรอบเพื่อเปิดผู้ชนะ"
                    : `เปิดอันดับแล้ว • ${frames.at(-1).label}`;
            }
        }

        function revealRace(cover, mode, key, title, containerId) {
            if (!performanceReady && !performanceLoadFailed) {
                const status = cover.querySelector("p");
                if (status) status.textContent = "กำลังโหลดข้อมูล Performance และประวัติ...";
                return;
            }
            if (performanceLoadFailed || !performanceTimeline.length) {
                const status = cover.querySelector("p");
                if (status) status.textContent = "ไม่สามารถโหลดข้อมูลสำหรับการแข่งขันได้";
                return;
            }
            if (cover.dataset.revealing === "true") return;

            cover.dataset.revealing = "true";
            cover.style.pointerEvents = "none";
            cover.innerHTML = `
                <div class="suspense-ring mb-7">
                    <div class="suspense-ring-inner">
                        <span class="suspense-number">3</span>
                    </div>
                </div>
                <h2 class="text-2xl md:text-3xl font-black gold-text tracking-widest uppercase mb-2">เตรียมการแข่งขัน</h2>
                <p class="text-gray-400 tracking-widest text-xs md:text-sm uppercase">${title} • TOP 5</p>
            `;

            const number = cover.querySelector(".suspense-number");
            setTimeout(() => { if (number) number.textContent = "2"; }, 850);
            setTimeout(() => { if (number) number.textContent = "1"; }, 1700);
            setTimeout(() => {
                if (number) number.textContent = "GO!";
                cover.style.boxShadow = "0 0 90px rgba(234,179,8,0.4)";
            }, 2500);
            setTimeout(() => {
                cover.style.opacity = "0";
                cover.style.transform = "scale(1.06)";
            }, 3100);
            setTimeout(() => {
                cover.style.display = "none";
                startRace(mode, key, containerId);
            }, 3650);
        }

        function renderCategories(mode) {
            const container = document.getElementById(`categories-area-${mode}`);
            const categories = boardData[mode].categories;
            container.innerHTML = "";

            categories.forEach(cat => {
                const key = cat.key || performanceCategories.find(category => cat.id.endsWith(category.suffix))?.key;
                if (!key) return;
                const safeTitle = cat.title.replace(/'/g, "");
                const raceId = `race-${mode}-${key}`;
                const card = document.createElement("article");
                card.className = "award-slide category-card race-card glass-panel group shadow-lg";
                card.dataset.awardSlide = "";
                card.dataset.awardTitle = cat.title;
                card.dataset.awardKey = key;
                card.dataset.raceContainerId = raceId;
                card.innerHTML = `
                    <div class="race-cover absolute inset-0 bg-[#070707] z-30 flex flex-col items-center justify-center cursor-pointer transition-all duration-700 hover:bg-[#111]"
                         onclick="revealRace(this, '${mode}', '${key}', '${safeTitle}', '${raceId}')">
                        <div class="w-24 h-24 bg-gradient-to-tr from-yellow-600 to-yellow-300 rounded-full flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(234,179,8,0.5)] animate-pulse">
                            <span class="text-4xl font-black text-black">TOP 5</span>
                        </div>
                        <h2 class="text-2xl md:text-3xl font-black gold-text tracking-widest uppercase mb-2">START THE RACE</h2>
                        <p class="text-gray-400 tracking-widest text-sm uppercase text-center">${cat.title}</p>
                    </div>
                    <div class="race-header">
                        <div>
                            <h3>${cat.title}</h3>
                            <p>${cat.subtitle || ""} • ${key === "sales" ? "จัดอันดับตามยอดขายสูงสุด" : "แข่งขันด้วย % Index เทียบเป้า"}</p>
                        </div>
                        <span id="race-date-${mode}-${key}" class="race-date">พร้อมเริ่ม</span>
                    </div>
                    <div id="${raceId}" class="race-track"></div>
                    <div class="race-footer">
                        <span>ตำแหน่งคงที่ • แท่งแซงกัน • เปิดอันดับตอนจบ</span>
                        <button class="race-replay" type="button" onclick="startRace('${mode}', '${key}', '${raceId}')">↻ แข่งใหม่</button>
                    </div>
                `;
                card.addEventListener("click", handleRaceCardClick);
                container.appendChild(card);
            });
            showAward(mode, awardIndex[mode]);
        }

        renderCategories('ps');
        renderCategories('ads');
        loadPerformanceData();
    </script>
</body>
</html>
